    html,body{margin:0;height:100%;background:#FF3B5C}
    #qsplash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#FF3B5C;color:#0E1726;font-family:QBrand,system-ui,sans-serif;transition:opacity .35s;z-index:10}
    #qsplash.out{opacity:0;pointer-events:none}
    #qsplash .nm{font-size:72px;font-weight:800;transform:skewX(-10deg);line-height:1}
    #qsplash .bar{height:9px;width:0;border-radius:9px;background:#0E1726;margin-top:6px;animation:g .5s .2s cubic-bezier(.6,0,.2,1) forwards}
    #qsplash .sub{font-size:24px;font-weight:800;transform:skewX(-8deg);margin-top:16px}
    #qsplash .load{position:absolute;bottom:64px;width:120px;height:4px;border-radius:4px;background:rgba(14,23,38,.18);overflow:hidden}
    #qsplash .load i{display:block;width:40%;height:100%;background:#0E1726;border-radius:4px;animation:l 1s ease-in-out infinite}
    @keyframes g{to{width:190px}}
    @keyframes l{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
    @media (prefers-reduced-motion:reduce){#qsplash .bar{width:190px;animation:none}#qsplash .load i{animation:none}}
  </style>
</head>
<body>
  <div id="qsplash" aria-label="قوام">
    <div class="nm">قوام</div><div class="bar"></div><div class="sub">ارجع أقوى.</div>
    <div class="load"><i></i></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('qsplash');
      if (s) { s.classList.add('out'); setTimeout(function () { s.remove(); }, 400); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
